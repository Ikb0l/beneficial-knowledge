name: beneficial-knowledge

logger:
  level: INFO
  stdout: true
  format: json

session:
  token_expiry_sec: 3600
  refresh_token_expiry_sec: 2592000
  single_match: false
  single_party: false
  single_socket: false

socket:
  max_message_size_bytes: 32768
  # Allow larger admin bulk-import payloads (JSON question batches).
  max_request_size_bytes: 10485760
  read_buffer_size_bytes: 4096
  write_buffer_size_bytes: 4096
  read_timeout_ms: 10000
  write_timeout_ms: 10000
  ping_period_ms: 15000
  pong_wait_ms: 25000
  outgoing_queue_size: 64

runtime:
  js_entrypoint: "build/index.js"
  http_key: "${NAKAMA_HTTP_KEY}"

match:
  input_queue_size: 128
  call_queue_size: 128
  deferred_queue_size: 128
  join_attempt_queue_size: 128
  join_marker_deadline_ms: 15000
  max_empty_sec: 30
  label_update_interval_ms: 1000

matchmaker:
  max_tickets: 50000
  interval_sec: 3
  max_intervals: 20
  revPrecision: true

leaderboard:
  callback_queue_size: 256
  callback_queue_workers: 16

limit:
  max_message_size_bytes: 32768

metrics:
  reporting_freq_sec: 60
  namespace: "islamicquiz"
  prometheus_port: 9100

