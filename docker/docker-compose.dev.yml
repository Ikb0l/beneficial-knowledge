# =============================================================================
# DEVELOPMENT DOCKER COMPOSE - NOT FOR PRODUCTION USE
# =============================================================================
# WARNING: This configuration has insecure defaults for local development:
#   - ALLOW_INSECURE_TELEGRAM_AUTH=true bypasses Telegram signature validation
#   - Default admin Telegram ID is hardcoded
#   - Default database password is weak
#
# For production, create a separate docker-compose.prod.yml with:
#   - ALLOW_INSECURE_TELEGRAM_AUTH=false (or remove entirely)
#   - Strong POSTGRES_PASSWORD
#   - Real TELEGRAM_BOT_TOKEN
#   - Proper ADMIN_TELEGRAM_IDS list
#   - SSL/TLS enabled
#   - Proper resource limits
# =============================================================================

services:
  postgres:
    image: postgres:15-alpine
    container_name: beneficial-knowledge-postgres
    command:
      - postgres
      - -c
      - max_connections=1000
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
      - -c
      - wal_buffers=16MB
      - -c
      - checkpoint_completion_target=0.9
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  nakama-db-migrate:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.21.1
    container_name: beneficial-knowledge-nakama-db-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ec"
      - >
        /nakama/nakama migrate up --database.address postgres:${POSTGRES_PASSWORD:-localdb}@postgres:5432/nakama

  app-migrations:
    image: postgres:15-alpine
    container_name: beneficial-knowledge-app-migrations
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-localdb}
    depends_on:
      postgres:
        condition: service_healthy
      nakama-db-migrate:
        condition: service_completed_successfully
    volumes:
      - ../server/migrations:/migrations:ro
    entrypoint:
      - "/bin/sh"
      - "-ec"
      - >
        ls /migrations/*.sql >/dev/null &&
        for file in /migrations/*.sql; do
          echo "Applying app migration $$file";
          psql -h postgres -U postgres -d nakama -v ON_ERROR_STOP=1 -f "$$file";
        done

  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.21.1
    container_name: beneficial-knowledge-nakama
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      # SECURITY WARNING: Set to 'false' in production! This bypasses Telegram auth validation.
      - ALLOW_INSECURE_TELEGRAM_AUTH=${ALLOW_INSECURE_TELEGRAM_AUTH:-false}
      # SECURITY WARNING: Change this admin ID list in production!
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS:-937213894}
      - NAKAMA_HTTP_KEY=${NAKAMA_HTTP_KEY:-local_http_key}
      - NAKAMA_SERVER_KEY=${NAKAMA_SERVER_KEY:-dev_server_key_change_me}
      - NAKAMA_CONSOLE_USERNAME=${NAKAMA_CONSOLE_USERNAME:-admin}
      - NAKAMA_CONSOLE_PASSWORD=${NAKAMA_CONSOLE_PASSWORD:-dev_console_password_change_me}
      - NAKAMA_CONSOLE_SIGNING_KEY=${NAKAMA_CONSOLE_SIGNING_KEY:-dev_console_signing_key_change_me}
      - NAKAMA_SESSION_ENCRYPTION_KEY=${NAKAMA_SESSION_ENCRYPTION_KEY:-dev_session_encryption_key_change_me}
      - NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY=${NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY:-dev_session_refresh_key_change_me}
      # Optional admin token login for self-hosted setups
      - ADMIN_LOGIN_TOKEN=${ADMIN_LOGIN_TOKEN:-}
      # Web auth pepper for password hashing
      - WEB_AUTH_PEPPER=${WEB_AUTH_PEPPER:-dev_web_auth_pepper_change_me}
      - WEB_SESSION_TTL_MINUTES=${WEB_SESSION_TTL_MINUTES:-30}
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:${POSTGRES_PASSWORD:-localdb}@postgres:5432/nakama &&
        exec /nakama/nakama --name nakama
        --config /nakama/data/local.yml
        --database.address postgres:${POSTGRES_PASSWORD:-localdb}@postgres:5432/nakama
        --logger.level INFO
        --socket.server_key ${NAKAMA_SERVER_KEY:-dev_server_key_change_me}
        --runtime.http_key ${NAKAMA_HTTP_KEY:-local_http_key}
        --session.token_expiry_sec 7200
        --session.encryption_key ${NAKAMA_SESSION_ENCRYPTION_KEY:-dev_session_encryption_key_change_me}
        --session.refresh_encryption_key ${NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY:-dev_session_refresh_key_change_me}
        --runtime.env TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
        --runtime.env ALLOW_INSECURE_TELEGRAM_AUTH=${ALLOW_INSECURE_TELEGRAM_AUTH:-false}
        --runtime.env ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS:-937213894}
        --runtime.env ADMIN_LOGIN_TOKEN=${ADMIN_LOGIN_TOKEN:-}
        --runtime.env WEB_AUTH_PEPPER=${WEB_AUTH_PEPPER:-dev_web_auth_pepper_change_me}
        --runtime.env AI_SECRETS_ENCRYPTION_KEY=${AI_SECRETS_ENCRYPTION_KEY:-}
        --runtime.env WEB_SESSION_TTL_MINUTES=${WEB_SESSION_TTL_MINUTES:-30}
        --runtime.js_entrypoint "build/index.js"
        --socket.max_message_size_bytes 65536
        --socket.max_request_size_bytes 262144
    depends_on:
      postgres:
        condition: service_healthy
      app-migrations:
        condition: service_completed_successfully
    ports:
      - "7349:7349"   # gRPC API
      - "7350:7350"   # HTTP API
      - "7351:7351"   # Console (admin UI)
    volumes:
      - ../server/build:/nakama/data/modules/build:ro
      - ../server/local.yml:/nakama/data/local.yml:ro
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G

  redis:
    image: redis:7-alpine
    container_name: beneficial-knowledge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  tournament-cron:
    image: curlimages/curl:8.6.0
    container_name: beneficial-knowledge-tournament-cron
    restart: unless-stopped
    depends_on:
      nakama:
        condition: service_healthy
    environment:
      - NAKAMA_HOST=nakama
      - NAKAMA_PORT=7350
      - NAKAMA_HTTP_KEY=${NAKAMA_HTTP_KEY:-local_http_key}
    volumes:
      - ./tournament-cron.sh:/scripts/tournament-cron.sh:ro
    entrypoint: ["/bin/sh", "/scripts/tournament-cron.sh"]

volumes:
  postgres_data:
  redis_data:
