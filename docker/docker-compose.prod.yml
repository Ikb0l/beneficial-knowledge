services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: beneficial-knowledge-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - beneficial-knowledge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # One-shot Nakama core schema migration
  nakama-db-migrate:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.21.1
    container_name: beneficial-knowledge-nakama-db-migrate-prod
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ec"
      - >
        /nakama/nakama migrate up --database.address ${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    networks:
      - beneficial-knowledge-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # One-shot app schema migrations
  app-migrations:
    image: postgres:15-alpine
    container_name: beneficial-knowledge-app-migrations-prod
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
    depends_on:
      postgres:
        condition: service_healthy
      nakama-db-migrate:
        condition: service_completed_successfully
    volumes:
      - ../server/migrations:/migrations:ro
    entrypoint:
      - "/bin/sh"
      - "-ec"
      - >
        ls /migrations/*.sql >/dev/null &&
        for file in /migrations/*.sql; do
          echo "Applying app migration $$file";
          psql -h postgres -U ${POSTGRES_USER} -d ${POSTGRES_DB} -v ON_ERROR_STOP=1 -f "$$file";
        done
    networks:
      - beneficial-knowledge-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: beneficial-knowledge-redis-prod
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - beneficial-knowledge-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Nakama Game Server
  nakama:
    image: registry.heroiclabs.com/heroiclabs/nakama:3.21.1
    container_name: beneficial-knowledge-nakama-prod
    restart: unless-stopped
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        SSL_ARGS="" &&
        if [ -n "$$NAKAMA_SSL_CERTIFICATE" ] && [ -n "$$NAKAMA_SSL_PRIVATE_KEY" ]; then
          SSL_ARGS="--socket.ssl_certificate $$NAKAMA_SSL_CERTIFICATE --socket.ssl_private_key $$NAKAMA_SSL_PRIVATE_KEY";
        fi &&
        /nakama/nakama migrate up --database.address ${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB} &&
        exec /nakama/nakama --name nakama
        --database.address ${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
        --socket.server_key ${NAKAMA_SERVER_KEY:?NAKAMA_SERVER_KEY is required}
        --runtime.http_key ${NAKAMA_HTTP_KEY:?NAKAMA_HTTP_KEY is required}
        --console.username ${NAKAMA_CONSOLE_USERNAME:?NAKAMA_CONSOLE_USERNAME is required}
        --console.password ${NAKAMA_CONSOLE_PASSWORD:?NAKAMA_CONSOLE_PASSWORD is required}
        --console.signing_key ${NAKAMA_CONSOLE_SIGNING_KEY:?NAKAMA_CONSOLE_SIGNING_KEY is required}
        --session.encryption_key ${NAKAMA_SESSION_ENCRYPTION_KEY:?NAKAMA_SESSION_ENCRYPTION_KEY is required}
        --session.refresh_encryption_key ${NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY:?NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY is required}
        --runtime.env ALLOW_INSECURE_TELEGRAM_AUTH=false
        --runtime.env TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
        --runtime.env ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS:?ADMIN_TELEGRAM_IDS is required}
        --runtime.env ADMIN_LOGIN_TOKEN=${ADMIN_LOGIN_TOKEN:-}
        --runtime.env WEB_AUTH_PEPPER=${WEB_AUTH_PEPPER:?WEB_AUTH_PEPPER is required}
        --runtime.env AI_SECRETS_ENCRYPTION_KEY=${AI_SECRETS_ENCRYPTION_KEY:?AI_SECRETS_ENCRYPTION_KEY is required}
        --runtime.env WEB_SESSION_TTL_MINUTES=${WEB_SESSION_TTL_MINUTES:-30}
        $$SSL_ARGS
        --config /nakama/data/production.yml
    depends_on:
      postgres:
        condition: service_healthy
      app-migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS:?ADMIN_TELEGRAM_IDS is required}
      - ALLOW_INSECURE_TELEGRAM_AUTH=false
      - ADMIN_LOGIN_TOKEN=${ADMIN_LOGIN_TOKEN:-}
      - WEB_AUTH_PEPPER=${WEB_AUTH_PEPPER:?WEB_AUTH_PEPPER is required}
      - AI_SECRETS_ENCRYPTION_KEY=${AI_SECRETS_ENCRYPTION_KEY:?AI_SECRETS_ENCRYPTION_KEY is required}
      - WEB_SESSION_TTL_MINUTES=${WEB_SESSION_TTL_MINUTES:-30}
      - NAKAMA_HTTP_KEY=${NAKAMA_HTTP_KEY:?NAKAMA_HTTP_KEY is required}
      - NAKAMA_SSL_CERTIFICATE=${NAKAMA_SSL_CERTIFICATE:-}
      - NAKAMA_SSL_PRIVATE_KEY=${NAKAMA_SSL_PRIVATE_KEY:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    ports:
      - "${NAKAMA_BIND_ADDRESS:-0.0.0.0}:${NAKAMA_API_PORT:-7350}:7350"   # HTTP API
      # - "7351:7351" # Console (admin UI) - expose only on trusted networks if needed
    volumes:
      - ../server/build:/nakama/data/modules/build:ro
      - ../server/production.yml:/nakama/data/production.yml:ro
    networks:
      - beneficial-knowledge-network
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  # Client Web App
  client:
    build:
      context: ../client
      dockerfile: Dockerfile
      args:
        VITE_NAKAMA_HOST: ${VITE_NAKAMA_HOST:?VITE_NAKAMA_HOST is required}
        VITE_NAKAMA_PORT: ${VITE_NAKAMA_PORT:-7350}
        VITE_NAKAMA_KEY: ${VITE_NAKAMA_KEY:?VITE_NAKAMA_KEY is required}
        VITE_NAKAMA_SSL: ${VITE_NAKAMA_SSL:-true}
        VITE_USE_PROXY: ${VITE_USE_PROXY:-true}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN}
        VITE_SENTRY_DEV: ${VITE_SENTRY_DEV}
        VITE_APP_VERSION: ${VITE_APP_VERSION}
        VITE_TELEGRAM_BOT_ID: ${VITE_TELEGRAM_BOT_ID}
        VITE_TELEGRAM_BOT_USERNAME: ${VITE_TELEGRAM_BOT_USERNAME}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    container_name: beneficial-knowledge-client-prod
    restart: unless-stopped
    ports:
      - "${CLIENT_BIND_ADDRESS:-0.0.0.0}:${CLIENT_WEB_PORT:-80}:80"
    networks:
      - beneficial-knowledge-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # Admin Web App
  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        VITE_NAKAMA_HOST: ${VITE_NAKAMA_HOST:?VITE_NAKAMA_HOST is required}
        VITE_NAKAMA_PORT: ${VITE_NAKAMA_PORT:-7350}
        VITE_NAKAMA_KEY: ${VITE_NAKAMA_KEY:?VITE_NAKAMA_KEY is required}
        VITE_NAKAMA_SSL: ${VITE_NAKAMA_SSL:-true}
        VITE_USE_PROXY: ${VITE_USE_PROXY:-true}
    container_name: beneficial-knowledge-admin-prod
    restart: unless-stopped
    depends_on:
      nakama:
        condition: service_healthy
    ports:
      - "${ADMIN_BIND_ADDRESS:-0.0.0.0}:${ADMIN_WEB_PORT:-3002}:80"
    networks:
      - beneficial-knowledge-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # Optional Cloudflare named tunnel (recommended for production ingress)
  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    container_name: beneficial-knowledge-cloudflared
    restart: unless-stopped
    profiles:
      - tunnel
    depends_on:
      client:
        condition: service_healthy
      admin:
        condition: service_healthy
      nakama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      if [ -z "$$CLOUDFLARE_TUNNEL_TOKEN" ]; then
        echo "CLOUDFLARE_TUNNEL_TOKEN is required when cloudflared profile is enabled.";
        exit 1;
      fi
      exec cloudflared tunnel --no-autoupdate run --token "$$CLOUDFLARE_TUNNEL_TOKEN"
    environment:
      - CLOUDFLARE_TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - beneficial-knowledge-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
  tournament-cron:
    image: curlimages/curl:8.6.0
    container_name: beneficial-knowledge-tournament-cron
    restart: unless-stopped
    depends_on:
      nakama:
        condition: service_healthy
    environment:
      - NAKAMA_HOST=nakama
      - NAKAMA_PORT=7350
      - NAKAMA_HTTP_KEY=${NAKAMA_HTTP_KEY:?NAKAMA_HTTP_KEY is required}
    volumes:
      - ./tournament-cron.sh:/scripts/tournament-cron.sh:ro
    entrypoint: ["/bin/sh", "/scripts/tournament-cron.sh"]
    networks:
      - beneficial-knowledge-network
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  # Prometheus for metrics collection (optional)
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: beneficial-knowledge-prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9090:9090"
    networks:
      - beneficial-knowledge-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

networks:
  beneficial-knowledge-network:
    driver: bridge

volumes:
  postgres_data:
    name: beneficial-knowledge-postgres-prod-data
  redis_data:
    name: beneficial-knowledge-redis-prod-data
  prometheus_data:
    name: beneficial-knowledge-prometheus-prod-data





